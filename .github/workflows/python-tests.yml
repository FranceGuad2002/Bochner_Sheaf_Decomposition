name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Run the tests at 00:00 each day
    - cron: "0 0 * * *"

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      # torch-householder compiles against torch: build it with the installed CPU
      # torch instead of letting pip download a CUDA build into an isolated sandbox.
      PIP_NO_BUILD_ISOLATION: "0"
      # torch 1.11 asks for an executable stack, which recent glibc refuses by default.
      GLIBC_TUNABLES: glibc.rtld.execstack=2
    strategy:
      matrix:
        python-version: [3.9]
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4
      - name: cache conda
        uses: actions/cache@v4
        env:
          # Increase this value to reset cache if etc/example-environment.yml has not changed
          CACHE_NUMBER: 1
        with:
          path: ~/conda_pkgs_dir
          key:
            ${{ runner.os }}-conda-${{ env.CACHE_NUMBER }}-${{
            hashFiles('environment_cpu.yml') }}
      - name: pin the packages that torch 1.11 needs
        # Recent mkl and numpy releases are not compatible with torch 1.11, and the
        # CPU build of torch must be the one installed. Pinned in a temporary copy,
        # so that environment_cpu.yml stays the upstream file.
        run: |
          sed -e '/- cpuonly/a\  - mkl<2024.1' \
              -e '/- cpuonly/a\  - numpy<2' \
              -e 's/- pytorch=1.11.0/- pytorch=1.11.0=*cpu*/' \
              environment_cpu.yml > ci_environment.yml
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: nsd
          environment-file: ci_environment.yml
          python-version: 3.9
          use-only-tar-bz2: true # IMPORTANT: This needs to be set for caching to work properly!
      - name: Test with pytest
        run: |
          conda activate nsd
          pytest -v