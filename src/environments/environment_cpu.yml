# CPU-only environment: the upstream environment_cpu.yml with the pins that make it
# install today (recent mkl and numpy do not work with torch 1.11, and without the
# CPU pins conda picks the CUDA builds of the PyG packages).
#     conda env create -f src/environments/environment_cpu.yml
channels:
  - pytorch
  - conda-forge
  - defaults
  - pyg
dependencies:
  - pip=21.3.1
  - pyg=2.0.4=*cpu*
  - python=3.9.9
  - cpuonly
  - mkl<2024.1
  - numpy<2
  - pytorch-scatter=*=*cpu*
  - pytorch-sparse=*=*cpu*
  - pytorch-cluster=*=*cpu*
  - pytorch-spline-conv=*=*cpu*
  - pytorch=1.11.0=*cpu*
  - pip:
      - torch-householder==1.0.1
      - tqdm==4.62.3
      - pytest==6.2.5
      - wandb==0.13.1
      - torchdiffeq==0.2.2
      - networkx==2.6.3
name: nsd
